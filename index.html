</footer>

<script>
(function () {
  "use strict";

  /* HERO CAROUSEL */
  const carousel = document.querySelector(".hero-carousel");

  if (carousel) {
    const slides = [...carousel.querySelectorAll(".hero-slide")];
    const counter = document.getElementById("hero-current");
    const prev = carousel.querySelector(".hero-prev");
    const next = carousel.querySelector(".hero-next");

    let current = 0;
    let touchStartX = 0;
    let autoPlay;

    function showSlide(index) {
      slides[current].classList.remove("active");
      current = (index + slides.length) % slides.length;
      slides[current].classList.add("active");
      counter.textContent = String(current + 1).padStart(2, "0");
    }

    function restartAutoPlay() {
      clearInterval(autoPlay);
      autoPlay = setInterval(() => {
        showSlide(current + 1);
      }, 5000);
    }

    prev.addEventListener("click", () => {
      showSlide(current - 1);
      restartAutoPlay();
    });

    next.addEventListener("click", () => {
      showSlide(current + 1);
      restartAutoPlay();
    });

    carousel.addEventListener("touchstart", event => {
      touchStartX = event.changedTouches[0].screenX;
    }, { passive:true });

    carousel.addEventListener("touchend", event => {
      const diff = event.changedTouches[0].screenX - touchStartX;

      if (Math.abs(diff) > 50) {
        showSlide(current + (diff < 0 ? 1 : -1));
        restartAutoPlay();
      }
    }, { passive:true });

    restartAutoPlay();
  }

  /* GOOGLE SHEETS TESTIMONIALS */
  const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQw6Uzj26ys6CvMZjGWeVMtzQJCg7k3RisPhPLE5Tcer9LU4SZg6eApVXkPqww2NKiFdCP2XGV9VCIR/pub?output=csv";

  const track = document.getElementById("home-testimonial-track");
  const viewport = document.getElementById("home-testimonial-viewport");
  const prevButton = document.getElementById("testimonial-prev");
  const nextButton = document.getElementById("testimonial-next");
  const status = document.getElementById("testimonial-status");

  let slideIndex = 0;
  let testimonialCount = 0;

  function parseCSV(text) {
    const rows = [];
    let row = [];
    let value = "";
    let quoted = false;

    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      const next = text[i + 1];

      if (ch === '"' && quoted && next === '"') {
        value += '"';
        i++;
      } else if (ch === '"') {
        quoted = !quoted;
      } else if (ch === "," && !quoted) {
        row.push(value);
        value = "";
      } else if ((ch === "\n" || ch === "\r") && !quoted) {
        if (ch === "\r" && next === "\n") i++;
        row.push(value);

        if (row.some(v => v.trim() !== "")) rows.push(row);

        row = [];
        value = "";
      } else {
        value += ch;
      }
    }

    row.push(value);
    if (row.some(v => v.trim() !== "")) rows.push(row);
    if (!rows.length) return [];

    const headers = rows.shift().map(h =>
      h.replace(/^\uFEFF/, "").trim().toLowerCase()
    );

    return rows.map(cells => {
      const item = {};
      headers.forEach((header, i) => {
        item[header] = (cells[i] || "").trim();
      });
      return item;
    });
  }

  function getField(item, names) {
    for (const name of names) {
      const key = name.toLowerCase();

      if (item[key] !== undefined && item[key] !== "") {
        return item[key];
      }
    }

    return "";
  }

  function isYes(value) {
    return ["ya", "yes", "true", "1", "iya"].includes(
      String(value).trim().toLowerCase()
    );
  }

  function getPhotoURL(value) {
    const input = String(value || "").trim();
    if (!input) return "";

    try {
      const url = new URL(input);

      if (
        url.hostname === "drive.google.com" ||
        url.hostname === "www.drive.google.com"
      ) {
        let id = url.searchParams.get("id");
        const match = url.pathname.match(/\/file\/d\/([^/]+)/);

        if (!id && match) id = match[1];

        if (id) {
          return "https://drive.google.com/uc?export=view&id=" +
            encodeURIComponent(id);
        }
      }

      return /^https?:$/.test(url.protocol) ? url.href : "";
    } catch (_) {
      return "";
    }
  }

  function makeCard(item) {
    const name = getField(item, [
      "nama pasangan", "nama", "pasangan"
    ]) || "Couple";

    const photo = getPhotoURL(getField(item, [
      "foto", "photo", "foto pasangan"
    ]));

    const service = getField(item, [
      "layanan", "service"
    ]) || "Photography";

    const date = getField(item, [
      "tanggal event", "tanggal acara", "tanggal", "event date"
    ]);

    const review = getField(item, [
      "testimoni", "testimonial", "review"
    ]);

    const rawRating = Number(getField(item, ["rating", "bintang"]));

    const rating = Number.isFinite(rawRating)
      ? Math.max(0, Math.min(5, Math.round(rawRating)))
      : 5;

    const article = document.createElement("article");
    article.className = "testimonial-card";

    const person = document.createElement("div");
    person.className = "testimonial-person";

    const initials = name.split(/\s*&\s*|\s+/)
      .filter(Boolean)
      .slice(0, 2)
      .map(part => part.charAt(0).toUpperCase())
      .join("") || "KP";

    const fallback = document.createElement("div");
    fallback.className = "testimonial-photo";
    fallback.style.display = "flex";
    fallback.style.flexShrink = "0";
    fallback.style.alignItems = "center";
    fallback.style.justifyContent = "center";
    fallback.style.fontFamily = '"Playfair Display",serif';
    fallback.style.fontSize = "17px";
    fallback.style.color = "#302821";
    fallback.textContent = initials;

    const avatar = document.createElement("img");
    avatar.className = "testimonial-photo";
    avatar.alt = "Client portrait for " + name + " — Kyra Picture testimonial";
    avatar.loading = "lazy";

    if (photo) {
      avatar.onload = () => {
        fallback.style.display = "none";
      };

      avatar.onerror = () => {
        avatar.style.display = "none";
      };

      avatar.src = photo;
    } else {
      avatar.style.display = "none";
    }

    const info = document.createElement("div");
    info.className = "testimonial-person-info";

    const author = document.createElement("p");
    author.className = "testimonial-author";
    author.textContent = name;

    const stars = document.createElement("div");
    stars.className = "testimonial-stars";
    stars.setAttribute("aria-label", rating + " out of 5 stars");
    stars.textContent = "★".repeat(rating) + "☆".repeat(5 - rating);

    info.append(author, stars);
    person.append(avatar, fallback, info);

    const mark = document.createElement("p");
    mark.className = "testimonial-mark";
    mark.setAttribute("aria-hidden", "true");
    mark.textContent = "“";

    const quote = document.createElement("blockquote");
    quote.className = "testimonial-quote";
    quote.textContent = review || "Thank you for trusting Kyra Picture.";

    const bottom = document.createElement("div");

    const divider = document.createElement("div");
    divider.className = "testimonial-divider";

    const meta = document.createElement("p");
    meta.className = "testimonial-meta";
    meta.textContent = date ? service + " · " + date : service;

    bottom.append(divider, meta);
    article.append(person, mark, quote, bottom);

    return article;
  }

  function visibleCards() {
    if (window.innerWidth <= 520) return 1;
    if (window.innerWidth <= 800) return 2;
    return 3;
  }

  function updateCarousel() {
    if (!track || !viewport) return;

    const cards = track.querySelectorAll(".testimonial-card");

    if (!cards.length) {
      prevButton.disabled = true;
      nextButton.disabled = true;
      return;
    }

    const gap = parseFloat(getComputedStyle(track).gap) || 0;
    const cardWidth = cards[0].getBoundingClientRect().width;

    const maxIndex = Math.max(
      0,
      testimonialCount - visibleCards()
    );

    slideIndex = Math.max(0, Math.min(slideIndex, maxIndex));

    const offset = slideIndex * (cardWidth + gap);
    track.style.transform = "translateX(-" + offset + "px)";

    if (window.innerWidth <= 520) {
      viewport.style.height = cards[slideIndex].offsetHeight + "px";
    } else {
      viewport.style.height = "";
    }

    prevButton.disabled = slideIndex <= 0;
    nextButton.disabled = slideIndex >= maxIndex;

    const first = testimonialCount ? slideIndex + 1 : 0;
    const last = Math.min(
      slideIndex + visibleCards(),
      testimonialCount
    );

    status.textContent = testimonialCount
      ? first + "–" + last + " of " + testimonialCount
      : "0 testimonials";
  }

  prevButton.addEventListener("click", () => {
    slideIndex = Math.max(0, slideIndex - 1);
    updateCarousel();
  });

  nextButton.addEventListener("click", () => {
    slideIndex = Math.min(
      Math.max(0, testimonialCount - visibleCards()),
      slideIndex + 1
    );

    updateCarousel();
  });

  window.addEventListener("resize", updateCarousel);

  fetch(CSV_URL, { cache:"no-store" })
    .then(response => {
      if (!response.ok) {
        throw new Error("Google Sheets CSV could not be loaded");
      }

      return response.text();
    })
    .then(csv => {
      const rows = parseCSV(csv);

      const published = rows.filter(item =>
        getField(item, [
          "status", "status publikasi"
        ]).trim().toLowerCase() === "published"
      );

      const homeItems = published.filter(item =>
        isYes(getField(item, [
          "tampil di home",
          "tampil di homepage",
          "tampil di beranda",
          "home",
          "show on home"
        ]))
      );

      track.innerHTML = "";
      testimonialCount = homeItems.length;
      slideIndex = 0;

      if (!homeItems.length) {
        const message = document.createElement("p");
        message.className = "testimonial-message";

        message.textContent = published.length
          ? "Belum ada testimoni yang dipilih untuk halaman Home."
          : "Testimoni akan ditampilkan di sini segera.";

        track.appendChild(message);
        status.textContent = "No testimonials";
        prevButton.disabled = true;
        nextButton.disabled = true;

        return;
      }

      homeItems.forEach(item => {
        track.appendChild(makeCard(item));
      });

      requestAnimationFrame(updateCarousel);
    })
    .catch(error => {
      console.error("Testimonials could not be loaded:", error);

      track.innerHTML = "";

      const message = document.createElement("p");
      message.className = "testimonial-message";
      message.textContent = "Testimoni belum bisa dimuat. Silakan coba lagi nanti.";

      track.appendChild(message);

      status.textContent = "Unavailable";
      prevButton.disabled = true;
      nextButton.disabled = true;
    });
})();
</script>
</body>
</html>
