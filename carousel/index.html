<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Pinggir Rel 3D — v3</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:Poppins,system-ui,sans-serif;color:#f3eee4;display:flex;align-items:center;justify-content:center}
#f{position:relative;width:min(100vw,calc(100vh*9/16));aspect-ratio:9/16;overflow:hidden;background:#05070d}
canvas{position:absolute;inset:0;width:100%;height:100%}

/* CAPTION */
#cap{position:absolute;left:7%;right:7%;bottom:21%;text-align:center;font-weight:600;font-size:calc(var(--u)*5.6);line-height:1.3;text-shadow:0 2px 16px #000,0 0 4px #000;-webkit-text-stroke:.4px rgba(0,0,0,.35);opacity:0;transition:opacity .5s;z-index:6}
#cap span{display:inline-block;margin:0 .14em;opacity:0;transform:translateY(.3em);animation:w .45s forwards}
@keyframes w{to{opacity:1;transform:none}}
#cap .hi{color:#ffcf8a}

/* OVERLAY */
#grade{position:absolute;inset:0;z-index:3;pointer-events:none;background:linear-gradient(180deg,rgba(20,40,80,.18),rgba(80,30,10,.12));mix-blend-mode:overlay}
#grain{position:absolute;inset:0;z-index:3;pointer-events:none;opacity:.06;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");background-size:120px 120px}
#vg{position:absolute;inset:0;z-index:3;pointer-events:none;background:radial-gradient(ellipse at 42% 52%,transparent 42%,rgba(0,0,0,.82));animation:breathe 6s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.92}50%{opacity:1}}
#sc{position:absolute;inset:auto 0 0;height:45%;background:linear-gradient(to top,rgba(0,0,0,.75),transparent);z-index:3;pointer-events:none}

/* CHAT WA */
#ph{position:absolute;z-index:5;left:6%;right:6%;top:5%;max-height:38%;display:flex;flex-direction:column;justify-content:flex-end;gap:calc(var(--u)*1.2);overflow:hidden;opacity:0;transition:opacity .8s;font-size:calc(var(--u)*3.2);line-height:1.25}
.m{background:#1f2a3a;border-radius:10px 10px 10px 2px;padding:calc(var(--u)*1.8) calc(var(--u)*2.2);opacity:0;transform:translateY(8px);animation:i .5s forwards;position:relative;box-shadow:0 2px 8px rgba(0,0,0,.4);max-width:88%}
.m b{display:block;font-size:.72em;color:#8fa6d8;margin-bottom:2px;font-weight:600}
.m .t{position:absolute;right:8px;bottom:4px;font-size:.6em;opacity:.5;font-weight:400}
.m.r{background:#3a1f1f}.m.r b{color:#e07a7a}
.m.w{background:#1e3a2a}.m.w b{color:#6fcf9b}
.m.me{background:#1f3a2e;align-self:flex-end;border-radius:10px 10px 2px 10px}
.m.me b{color:#9fe0b8}
.m.typing{padding:calc(var(--u)*1.4) calc(var(--u)*2.2)}
.m.typing .dots span{display:inline-block;width:.5em;height:.5em;border-radius:50%;background:#8fa6d8;margin-right:.25em;opacity:.4;animation:dot 1.2s infinite}
.m.typing .dots span:nth-child(2){animation-delay:.2s}
.m.typing .dots span:nth-child(3){animation-delay:.4s}
@keyframes dot{0%,60%,100%{opacity:.4;transform:translateY(0)}30%{opacity:1;transform:translateY(-2px)}}
@keyframes i{to{opacity:1;transform:none}}
.tick{color:#4a9eff;font-size:.75em;margin-left:4px}
.tick.gray{color:#5a5a5a}

/* START/END */
#st{position:absolute;inset:0;z-index:9;background:#05070d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;cursor:pointer;text-align:center;padding:0 10%}
#st h1{font-weight:400;font-size:calc(var(--u)*7.5);letter-spacing:.22em;margin:0;text-indent:.22em}
#st p{margin:0;opacity:.55;font-size:calc(var(--u)*3);letter-spacing:.08em}
#st small{opacity:.35;font-size:calc(var(--u)*2.6);letter-spacing:.1em}
button{background:none;border:1px solid #c98a5a;color:inherit;padding:10px 26px;font:inherit;cursor:pointer;border-radius:2px;letter-spacing:.1em}

/* TITLE CARD */
#tc{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*2);opacity:0;pointer-events:none;transition:opacity .8s;background:#05070d}
#tc h2{font-weight:400;font-size:calc(var(--u)*6);letter-spacing:.22em;margin:0;text-indent:.22em;color:#f3eee4}
#tc em{font-style:normal;opacity:.55;font-size:calc(var(--u)*2.8);letter-spacing:.12em}
</style>
</head>
<body>
<div id="f">
  <div id="st">
    <h1>PINGGIR REL</h1>
    <p>sebuah cerita pendek</p>
    <button id="go">▶ Mulai</button>
    <small>nyalakan suara</small>
  </div>
  <div id="tc"><h2>PINGGIR REL</h2><em>untuk yang masih berjuang</em></div>
  <div id="sc"></div>
  <div id="vg"></div>
  <div id="grade"></div>
  <div id="grain"></div>
  <div id="ph"></div>
  <div id="cap"></div>
</div>

<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script>
// ============================================================
// 0. HELPERS & DOM
// ============================================================
const $ = s => document.querySelector(s);
const F = $('#f');
const V = (a,b,c) => new THREE.Vector3(a,b,c);

// ============================================================
// 1. STATE (dideklarasi PALING ATAS biar aman)
// ============================================================
let started = false;
let t0 = 0;
let tlIndex = 0;
let dawn = 0;
let dawnTarget = 0;
let trainStart = -1;
let bubbleShake = 0;
let fovCurrent = 38;
let fovTarget = 38;
let transStart = 0;
let transDur = 1000;
let transK = 1;
let mood = 'cold';
let moodLerp = { r:.165, g:.165, b:.28 };
let ac = null, Mg = null, NB = null, melodiInterval = null;
let cp, cl, cf, ct, C;
let breathState = { active:false };
let tor, Hd, eyeL, eyeR, browL, browR, mouth, pf, pl, sig, redLight;
let TR, tl, dust, breath, gd, sun, hemi, fill;
let smokePuffs = [];
let windowLights = [];
let cap, ph;

// ============================================================
// 2. RENDERER / SCENE / CAMERA
// ============================================================
const R = new THREE.WebGLRenderer({ antialias:true });
R.outputEncoding = THREE.sRGBEncoding;
R.toneMapping = THREE.ACESFilmicToneMapping;
R.shadowMap.enabled = true;
R.shadowMap.type = THREE.PCFSoftShadowMap;
F.insertBefore(R.domElement, F.firstChild);

const S = new THREE.Scene();
C = new THREE.PerspectiveCamera(38, 9/16, .1, 200);

function fit(){
  const w = F.clientWidth, h = F.clientHeight;
  F.style.setProperty('--u', w/100 + 'px');
  R.setPixelRatio(Math.min(devicePixelRatio, 2));
  R.setSize(w, h);
  C.aspect = w/h;
  C.updateProjectionMatrix();
}
addEventListener('resize', fit);
fit();

// ============================================================
// 3. SKY
// ============================================================
const cv = document.createElement('canvas');
cv.width = 2; cv.height = 256;
const cx = cv.getContext('2d');
const grad = cx.createLinearGradient(0,0,0,256);
[[0,'#0c1022'],[.45,'#2b2447'],[.8,'#8a4a5e'],[1,'#d98a58']].forEach(([o,c])=>grad.addColorStop(o,c));
cx.fillStyle = grad; cx.fillRect(0,0,2,256);
const skyTex = new THREE.CanvasTexture(cv);
skyTex.encoding = THREE.sRGBEncoding;
S.background = skyTex;
S.fog = new THREE.FogExp2(0x2a2a48, .02);

// ============================================================
// 4. LIGHTS
// ============================================================
hemi = new THREE.HemisphereLight(0x6677aa, 0x0a0a14, .55);
S.add(hemi);

sun = new THREE.DirectionalLight(0xff9a60, 1.3);
sun.position.set(-12, 6, -14);
sun.target.position.set(0, 0, 3);
sun.castShadow = true;
sun.shadow.camera.left = -8;
sun.shadow.camera.right = 8;
sun.shadow.camera.top = 8;
sun.shadow.camera.bottom = -8;
sun.shadow.camera.far = 60;
sun.shadow.camera.updateProjectionMatrix();
sun.shadow.mapSize.set(1024, 1024);
S.add(sun, sun.target);

fill = new THREE.DirectionalLight(0x6f8fff, .35);
fill.position.set(6, 3, 8);
S.add(fill);

// ============================================================
// 5. MATERIAL & BOX HELPERS
// ============================================================
const MS = (c, o={}) => new THREE.MeshStandardMaterial(Object.assign({ color:c, roughness:.9 }, o));
const box = (w,h,d,m,x,y,z,p=S) => {
  const b = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), m);
  b.position.set(x,y,z);
  p.add(b);
  return b;
};

// ============================================================
// 6. GROUND & REL
// ============================================================
gd = new THREE.Mesh(new THREE.PlaneGeometry(240,240), MS(0x11141d));
gd.rotation.x = -Math.PI/2;
gd.receiveShadow = true;
S.add(gd);

box(160, .12, 4, MS(0x232730), 0, .06, -1.12);
const steel = MS(0x8a909e, { metalness:.85, roughness:.3 });
[-.6, -1.65].forEach(z => box(160, .14, .1, steel, 0, .2, z));

// bantalan rel
const sleeperMesh = new THREE.InstancedMesh(new THREE.BoxGeometry(.28,.12,2.5), MS(0x1c1f2b), 130);
const m4 = new THREE.Matrix4();
for(let i=0;i<130;i++){
  m4.setPosition(-39 + i*.6, .1, -1.12);
  sleeperMesh.setMatrixAt(i, m4);
}
S.add(sleeperMesh);

// kerikil
const gravel = new THREE.InstancedMesh(new THREE.DodecahedronGeometry(.06,0), MS(0x2a2e3a), 400);
for(let i=0;i<400;i++){
  m4.makeRotationFromEuler(new THREE.Euler(Math.random()*6, Math.random()*6, Math.random()*6));
  m4.setPosition(-40 + Math.random()*80, .04 + Math.random()*.04, -2.5 + Math.random()*2.8);
  gravel.setMatrixAt(i, m4);
}
S.add(gravel);

// ============================================================
// 7. TIANG & KABEL
// ============================================================
const dk = MS(0x07090f);
for(let x=-42; x<=42; x+=14){
  box(.18, 7, .18, dk, x, 3.5, -3);
  box(.14, .14, 1.6, dk, x, 6.4, -3);
}
function makeCable(y0, sag){
  const pts = [];
  for(let x=-42; x<42; x+=14){
    for(let i=0;i<=16;i++){
      const t = i/16;
      pts.push(V(x + 14*t, y0 - Math.sin(Math.PI*t)*sag, -3));
    }
  }
  S.add(new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({ color:0x05060a })
  ));
}
makeCable(6.3, .7);
makeCable(5.7, .7);
makeCable(5.4, 1.2);

// burung di kabel
for(let i=0;i<4;i++){
  const b = new THREE.Mesh(new THREE.SphereGeometry(.06,8,6), MS(0x0a0a10));
  b.position.set(-20 + i*11, 5.72, -3);
  S.add(b);
}

// ============================================================
// 8. KAMPUNG
// ============================================================
const wm = new THREE.MeshBasicMaterial({ color:0xffd486 });
for(let i=0;i<24;i++){
  const w = 2 + Math.random()*1.2;
  const h = 1.8 + Math.random()*1.1;
  const d = 2 + Math.random();
  const x = -32 + i*2.7 + Math.random();
  const z = -8 - Math.random()*5;
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  S.add(g);

  box(w, h, d, MS(0x1a1d2e), 0, h/2, 0, g);

  const roofColor = [0x2a2230, 0x3a2a24, 0x22283a][Math.floor(Math.random()*3)];
  const roof = new THREE.Mesh(new THREE.ConeGeometry((w+.6)*.72, 1.1, 4), MS(roofColor));
  roof.rotation.y = Math.PI/4;
  roof.position.y = h + .55;
  g.add(roof);

  if(Math.random() < .7){
    const win = new THREE.Mesh(new THREE.PlaneGeometry(.35,.4), wm);
    win.position.set((Math.random()-.5)*w*.5, h*.55, d/2 + .02);
    g.add(win);

    if(Math.random() < .4){
      const lamp = new THREE.PointLight(0xffb060, .6, 4);
      lamp.position.set(win.position.x, h*.55, z + d/2 + .3);
      S.add(lamp);
      windowLights.push(lamp);
    }
  }

  if(Math.random() < .5){
    const smoke = new THREE.Mesh(
      new THREE.PlaneGeometry(.6,1.4),
      new THREE.MeshBasicMaterial({ color:0x8899aa, transparent:true, opacity:.12, depthWrite:false })
    );
    smoke.position.set(x + w*.2, h + 2, z);
    smoke.userData.baseY = h + 2;
    S.add(smoke);
    smokePuffs.push(smoke);
  }
}

// jemuran
for(let i=0;i<2;i++){
  const x = -15 + i*20;
  const pts = [V(x,2.2,-7), V(x+3,2.0,-7), V(x+6,2.2,-7)];
  S.add(new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({ color:0x0a0a10 })
  ));
  for(let j=0;j<4;j++){
    const cl2 = new THREE.Mesh(
      new THREE.PlaneGeometry(.3,.4),
      new THREE.MeshBasicMaterial({
        color: [0xc06060,0x6090c0,0xc0b060,0x60b080][j],
        side: THREE.DoubleSide
      })
    );
    cl2.position.set(x + .6 + j*1.3, 1.9, -7);
    S.add(cl2);
  }
}

// ============================================================
// 9. MENARA, KOTA, LANGIT
// ============================================================
const tower = new THREE.Mesh(new THREE.CylinderGeometry(.35,.4,8,12), MS(0x1a1d2e));
tower.position.set(7, 4, -9);
S.add(tower);
const towerTop = new THREE.Mesh(new THREE.SphereGeometry(.7,16,10), MS(0x2a2230));
towerTop.position.set(7, 8.3, -9);
S.add(towerTop);

redLight = new THREE.Mesh(new THREE.SphereGeometry(.12,8,6), new THREE.MeshBasicMaterial({ color:0xff2020 }));
redLight.position.set(7, 9.3, -9);
S.add(redLight);

for(let i=0;i<14;i++){
  box(3 + Math.random()*3, 8 + Math.random()*14, 3, MS(0x1a1d33), -36 + i*5.5, 6, -48);
}

// bintang
const starGeo = new THREE.BufferGeometry();
const starPos = [];
for(let i=0;i<160;i++) starPos.push((Math.random()-.5)*160, 25 + Math.random()*50, -80);
starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
S.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ size:.6, color:0xffffff, fog:false })));

// bulan
const moon = new THREE.Mesh(new THREE.SphereGeometry(1.2,16,12), new THREE.MeshBasicMaterial({ color:0xfff4e0 }));
moon.position.set(-14, 18, -45);
S.add(moon);
const moonGlow = new THREE.Mesh(
  new THREE.PlaneGeometry(6,6),
  new THREE.MeshBasicMaterial({ color:0xffe6c0, transparent:true, opacity:.15, depthWrite:false })
);
moonGlow.position.copy(moon.position);
S.add(moonGlow);

// ============================================================
// 10. PAGAR & SEMBOYAN
// ============================================================
for(let x=-14; x<=14; x+=1.1) box(.08, 1.1, .08, dk, x, .55, 1.6);
[.5, .95].forEach(y => box(30, .05, .05, dk, 0, y, 1.6));

sig = new THREE.Mesh(new THREE.SphereGeometry(.1,10,8), new THREE.MeshBasicMaterial({ color:0xe0453a }));
sig.position.set(10, 2.4, -2.6);
S.add(sig);
box(.06, 2.4, .06, dk, 10, 1.2, -2.6);

// ============================================================
// 11. KERETA
// ============================================================
TR = new THREE.Group();
TR.position.set(-70, 0, -1.12);
S.add(TR);

const bodyMat = MS(0x9aa2b2, { metalness:.4, roughness:.5 });
const stripeMat = MS(0xd9552b);
const winMat = new THREE.MeshBasicMaterial({ color:0xffe7a8 });

for(let i=0;i<5;i++){
  const car = new THREE.Group();
  car.position.x = i*5.4;
  TR.add(car);
  box(5.2, 2.5, 2.5, bodyMat, 0, 1.9, 0, car);
  box(5.22, .3, 2.52, stripeMat, 0, 1.5, 0, car);
  box(5, .5, 2, MS(0x15171f), 0, .5, 0, car);
  for(let j=0;j<4;j++) for(const z of [-1,1]){
    const q = new THREE.Mesh(new THREE.PlaneGeometry(.9,.8), winMat);
    q.position.set(-1.9 + j*1.25, 2.5, z*1.26);
    if(z < 0) q.rotation.y = Math.PI;
    car.add(q);
  }
}

tl = new THREE.PointLight(0xffc98a, 0, 22);
tl.position.set(11, 2.6, 2);
TR.add(tl);

// ============================================================
// 12. KARAKTER
// ============================================================
const jk = MS(0x232c47);
const pn = MS(0x161c30);
const sk = MS(0x7a5545);
const hair = MS(0x0b0b10);
const shoe = MS(0x0d0f16);
const upVec = V(0,1,0);
const M = new THREE.Group();
M.position.set(0, 0, 3);
M.rotation.y = -.45;
S.add(M);

function sph(r, m, x, y, z, sx=1, sy=1, sz=1, parent=M){
  const s = new THREE.Mesh(new THREE.SphereGeometry(r,20,14), m);
  s.position.set(x,y,z);
  s.scale.set(sx,sy,sz);
  s.castShadow = true;
  parent.add(s);
  return s;
}
function limb(a, b, r, m){
  const A = V(...a), B = V(...b);
  const d = B.clone().sub(A);
  const c = new THREE.Mesh(new THREE.CylinderGeometry(r, r*.9, d.length(), 14), m);
  c.position.copy(A).add(B).multiplyScalar(.5);
  c.quaternion.setFromUnitVectors(upVec, d.normalize());
  c.castShadow = true;
  M.add(c);
  sph(r*.95, m, ...a);
  sph(r*.9, m, ...b);
}

// badan
sph(.22, pn, 0, .2, 0, 1.1, .8, 1.1);
tor = sph(.3, jk, .08, .62, 0, .88, 1.35, .95);
tor.rotation.z = -.35;
sph(.28, MS(0x1b1f30), -.24, .55, 0, .6, 1, .9);
sph(.14, jk, .12, .97, 0, 1.2, .8, 1.4);

// kaki (duduk)
[-.14, .14].forEach(z => {
  limb([0,.2,z], [.55,.52,z], .11, pn);
  limb([.55,.52,z], [.66,.12,z], .095, pn);
  sph(.1, shoe, .74, .08, z, 1.7, .7, 1);
});

// lengan
[-1, 1].forEach(k => {
  limb([.2,.95,k*.24], [.42,.62,k*.3], .075, jk);
  limb([.42,.62,k*.3], [.62,.84,k*.09], .065, jk);
  sph(.06, sk, .63, .84, k*.09);
});

// kepala
Hd = new THREE.Group();
Hd.position.set(.2, .98, 0);
Hd.rotation.z = -.4;
M.add(Hd);

sph(.17, sk, .1, .2, 0, 1, 1.1, .95, Hd);      // wajah
sph(.18, hair, .07, .27, 0, 1.05, .8, 1, Hd);  // rambut
sph(.03, sk, .27, .18, 0, 1, 1, 1, Hd);        // hidung
sph(.035, sk, .07, .19, .16, 1, 1, 1, Hd);     // telinga kiri
sph(.035, sk, .07, .19, -.16, 1, 1, 1, Hd);    // telinga kanan

// mata
eyeL = sph(.026, MS(0x111111), .25, .21, .075, 1, 1, 1, Hd);
eyeR = sph(.026, MS(0x111111), .25, .21, -.075, 1, 1, 1, Hd);
// kantong mata
sph(.04, MS(0x3a2a26), .24, .16, .075, 1.2, .6, 1, Hd);
sph(.04, MS(0x3a2a26), .24, .16, -.075, 1.2, .6, 1, Hd);
// alis
browL = box(.05, .012, .018, MS(0x0a0a10), .25, .245, .075, Hd);
browR = box(.05, .012, .018, MS(0x0a0a10), .25, .245, -.075, Hd);
browL.rotation.z = -.15;
browR.rotation.z = -.15;
// mulut
mouth = box(.04, .012, .06, MS(0x2a1a1a), .27, .13, 0, Hd);

// HP
pf = new THREE.Group();
pf.position.set(.64, .86, 0);
pf.rotation.z = .25;
M.add(pf);
box(.015, .17, .085, MS(0x0b0f18), 0, 0, 0, pf);
const scr = new THREE.Mesh(
  new THREE.PlaneGeometry(.075,.15),
  new THREE.MeshBasicMaterial({ color:0x9cc6ff })
);
scr.rotation.y = -Math.PI/2;
scr.position.x = -.009;
pf.add(scr);

pl = new THREE.PointLight(0x8ec0ff, 1.6, 3.5);
pl.position.set(.5, .95, 0);
M.add(pl);

// ============================================================
// 13. PARTIKEL
// ============================================================
// debu
const dustGeo = new THREE.BufferGeometry();
const dustPos = new Float32Array(240);
for(let i=0;i<80;i++){
  dustPos[i*3]   = -4 + Math.random()*12;
  dustPos[i*3+1] = Math.random()*4;
  dustPos[i*3+2] = Math.random()*9;
}
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({
  size:.035, color:0xffd9a8, transparent:true, opacity:.5
}));
S.add(dust);

// napas
const breathGeo = new THREE.BufferGeometry();
const breathPos = new Float32Array(30);
breathGeo.setAttribute('position', new THREE.BufferAttribute(breathPos, 3));
breath = new THREE.Points(breathGeo, new THREE.PointsMaterial({
  size:.04, color:0xdde8ff, transparent:true, opacity:0
}));
M.add(breath);

// ============================================================
// 14. KAMERA SHOTS
// ============================================================
const SHOTS = {
  A:  [V(5.2,1.2,7.2), V(.3,1.2,3)],
  B:  [V(2.1,1.2,4.5), V(.45,1.0,3)],
  D:  [V(.55,.92,2.6), V(.45,.92,3)],
  E:  [V(0,.35,4.2), V(.2,1.3,3)],
  Fk: [V(2,3.5,6), V(0,9,-6)],
  W:  [V(6.8,1.8,9.2), V(.2,1.2,1.6)]
};
const SHOT_FOV = { A:38, B:34, D:30, E:42, Fk:44, W:38 };

cp = SHOTS.A[0].clone();
cl = SHOTS.A[1].clone();
cf = [cp.clone(), cl.clone()];
ct = SHOTS.A;

function go(name, dur){
  const shot = SHOTS[name];
  cf = [cp.clone(), cl.clone()];
  ct = shot;
  transStart = performance.now();
  transDur = dur*1000;
  transK = 0;
  fovTarget = SHOT_FOV[name] || 38;
}

// ============================================================
// 15. AUDIO
// ============================================================
const nw = () => ac ? ac.currentTime : 0;

function tone(freq, t, dur, type='sine', vol=.1, freq2){
  if(!ac) return;
  const o = ac.createOscillator();
  const g = ac.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if(freq2) o.frequency.exponentialRampToValueAtTime(freq2, t + dur);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + .01);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(Mg);
  o.start(t);
  o.stop(t + dur + .05);
}
function burst(t, dur, freq, vol){
  if(!ac || !NB) return;
  const s = ac.createBufferSource();
  s.buffer = NB;
  const q = ac.createBiquadFilter();
  q.type = 'bandpass';
  q.frequency.value = freq;
  const g = ac.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  s.connect(q).connect(g).connect(Mg);
  s.start(t, Math.random());
  s.stop(t + dur + .05);
}

function initAudio(){
  try{
    ac = new (window.AudioContext || window.webkitAudioContext)();
    Mg = ac.createGain();
    Mg.gain.value = .9;
    Mg.connect(ac.destination);

    // noise buffer
    const b = ac.createBuffer(1, ac.sampleRate*2, ac.sampleRate);
    const d = b.getChannelData(0);
    let l = 0;
    for(let i=0;i<d.length;i++){
      l = (l + .02*(Math.random()*2-1)) / 1.02;
      d[i] = l*3.5;
    }
    NB = b;

    // ambient noise
    const s1 = ac.createBufferSource();
    s1.buffer = b;
    s1.loop = true;
    const q1 = ac.createBiquadFilter();
    q1.frequency.value = 650;
    const g1 = ac.createGain();
    g1.gain.value = .16;
    s1.connect(q1).connect(g1).connect(Mg);
    s1.start();

    // drone
    const droneF = ac.createBiquadFilter();
    droneF.frequency.value = 480;
    const droneG = ac.createGain();
    droneG.gain.value = .05;
    droneF.connect(droneG).connect(Mg);
    [110, 130.8, 164.8].forEach(f => {
      const o = ac.createOscillator();
      o.type = 'triangle';
      o.frequency.value = f;
      o.connect(droneF);
      o.start();
    });

    // melodi
    const notes = [440, 392, 329.6, 392, 293.7, 329.6, 261.6, 293.7];
    let k = 0;
    melodiInterval = setInterval(() => {
      if(!ac) return;
      const f = notes[k++ % 8];
      const t = nw();
      tone(f, t, 2.2, 'sine', .05);
      tone(f*2, t, 1, 'sine', .015);
    }, 2300);

    document.addEventListener('visibilitychange', () => {
      if(!document.hidden && ac && ac.state === 'suspended') ac.resume();
    });
  }catch(e){
    console.warn('Audio init failed:', e);
  }
}

const sfxPing = () => { if(!ac) return; const t = nw(); tone(880,t,.25,'sine',.12); tone(1320,t+.12,.35,'sine',.1); };
const sfxBuzzer = () => { if(!ac) return; const t = nw(); for(let k=0;k<3;k++) tone(90,t+k*.2,.13,'square',.07); };
const sfxBeat = n => { if(!ac) return; const t = nw(); for(let k=0;k<n;k++){ tone(55,t+k*.9,.2,'sine',.5); tone(48,t+k*.9+.3,.18,'sine',.4); } };
const sfxBell = n => { if(!ac) return; const t = nw(); for(let i=0;i<n;i++){ tone(1250,t+i*.5,.35,'sine',.08); tone(980,t+i*.5+.25,.35,'sine',.08); } };
const sfxType = () => { if(!ac) return; const t = nw(); for(let k=0;k<8;k++) burst(t+k*.15,.03,2600,.12); };
const sfxTrain = () => {
  if(!ac) return;
  const t = nw();
  tone(311, t+.5, 1.3, 'sawtooth', .05);
  tone(392, t+.5, 1.3, 'sawtooth', .05);
  const o = ac.createBufferSource();
  o.buffer = NB;
  o.loop = true;
  const q = ac.createBiquadFilter();
  q.frequency.value = 240;
  const g = ac.createGain();
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(.9, t+2);
  g.gain.linearRampToValueAtTime(0, t+7);
  o.connect(q).connect(g).connect(Mg);
  o.start(t);
  o.stop(t+7);
  for(let i=0;i<24;i++) burst(t+1.5+i*.2, .07, 200, .4);
};

// ============================================================
// 16. TEKS & CHAT
// ============================================================
cap = $('#cap');
ph = $('#ph');

function say(text, ms=2800, hi=null){
  cap.style.opacity = 0;
  setTimeout(() => {
    cap.innerHTML = '';
    text.split(' ').forEach((w, i) => {
      const sp = document.createElement('span');
      sp.style.animationDelay = (i*.09).toFixed(2) + 's';
      if(hi && w.toLowerCase().includes(hi.toLowerCase())) sp.className = 'hi';
      sp.textContent = w;
      cap.appendChild(sp);
    });
    cap.style.opacity = 1;
  }, 400);
  setTimeout(() => cap.style.opacity = 0, ms + 400);
}

function msg(sender, body, cls='', time=''){
  const d = document.createElement('div');
  d.className = 'm ' + cls;
  let html = '';
  if(sender) html += `<b>${sender}</b>`;
  html += body;
  if(time) html += `<span class="t">${time}</span>`;
  d.innerHTML = html;
  ph.appendChild(d);
  while(ph.children.length > 5) ph.removeChild(ph.firstChild);
  return d;
}

function typingIndicator(){
  const d = document.createElement('div');
  d.className = 'm typing';
  d.innerHTML = '<span class="dots"><span></span><span></span><span></span></span>';
  ph.appendChild(d);
  while(ph.children.length > 5) ph.removeChild(ph.firstChild);
  return d;
}

// ============================================================
// 17. MAIN LOOP
// ============================================================
function loop(){
  const now = performance.now();
  const s = (now - t0) / 1000;

  // kamera transisi
  if(transK < 1){
    transK = Math.min(1, (now - transStart) / transDur);
    const e = transK < .5 ? 4*transK**3 : 1 - Math.pow(-2*transK+2, 3)/2;
    cp.lerpVectors(cf[0], ct[0], e);
    cl.lerpVectors(cf[1], ct[1], e);
  }
  C.position.copy(cp).add(V(Math.sin(s*.4)*.05, Math.sin(s*.55)*.025, Math.sin(s*.3)*.05));
  C.lookAt(cl);
  fovCurrent += (fovTarget - fovCurrent) * .03;
  C.fov = fovCurrent;
  C.updateProjectionMatrix();

  // karakter
  tor.scale.y = 1.35 * (1 + .02*Math.sin(s*1.6));

  const blinkPhase = (s*1.3) % 3.5;
  const blink = blinkPhase > 3.3 ? Math.sin((blinkPhase - 3.3)*Math.PI*5) : 0;
  eyeL.scale.y = 1 - blink*.9;
  eyeR.scale.y = 1 - blink*.9;

  const browTarget = (mood === 'amber' || mood === 'dawn') ? .245 : .24;
  browL.position.y += (browTarget - browL.position.y) * .05;
  browR.position.y += (browTarget - browR.position.y) * .05;

  mouth.scale.y = mood === 'amber' ? .6 : 1;

  const headTarget = mood === 'dawn' ? .12 : -.4;
  Hd.rotation.z += (headTarget - Hd.rotation.z) * .025;

  pf.rotation.x = Math.sin(s*2.1) * .03;

  // grading
  const moodTargets = {
    cold:  { r:.165, g:.165, b:.28, sun:1.3, hemi:.55 },
    warn:  { r:.22,  g:.14,  b:.22, sun:1.1, hemi:.5  },
    amber: { r:.28,  g:.20,  b:.16, sun:1.5, hemi:.6  },
    dawn:  { r:.42,  g:.28,  b:.20, sun:2.2, hemi:.85 }
  };
  const mt = moodTargets[mood] || moodTargets.cold;
  moodLerp.r += (mt.r - moodLerp.r) * .015;
  moodLerp.g += (mt.g - moodLerp.g) * .015;
  moodLerp.b += (mt.b - moodLerp.b) * .015;
  S.fog.color.setRGB(moodLerp.r, moodLerp.g, moodLerp.b);
  sun.intensity += (mt.sun - sun.intensity) * .02;
  hemi.intensity += (mt.hemi - hemi.intensity) * .02;
  pl.intensity = 1.6 * (1 - dawn*.4);

  // semboyan & menara
  sig.visible = Math.floor(s*1.2) % 2 === 0;
  redLight.visible = Math.floor(s*.8) % 2 === 0;

  // kereta
  if(trainStart > 0){
    const a = (now - trainStart) / 1000;
    TR.position.x = -70 + a*11;
    const d = Math.abs(TR.position.x + 11);
    tl.intensity = Math.max(0, 1.8 - d/14) * 2;
    if(TR.position.x > 75) trainStart = -1;
  }

  // debu
  const dpp = dust.geometry.attributes.position;
  for(let i=0;i<80;i++){
    dpp.array[i*3+1] += .004;
    dpp.array[i*3]   += Math.sin(s*.5 + i) * .001;
    if(dpp.array[i*3+1] > 4) dpp.array[i*3+1] = 0;
  }
  dpp.needsUpdate = true;

  // napas
  if(breathState.active){
    const bp = breath.geometry.attributes.position;
    for(let i=0;i<10;i++){
      if(bp.array[i*3+1] < .4){
        bp.array[i*3]   += (Math.random()-.5) * .005;
        bp.array[i*3+1] += .012;
        bp.array[i*3+2] += (Math.random()-.5) * .005;
      }
    }
    bp.needsUpdate = true;
    breath.material.opacity += (.5 - breath.material.opacity) * .05;
  } else {
    breath.material.opacity += (0 - breath.material.opacity) * .05;
  }

  // asap
  smokePuffs.forEach(sm => {
    sm.position.y += .003;
    sm.material.opacity = .12 * (1 - ((sm.position.y - sm.userData.baseY)/3));
    if(sm.position.y > sm.userData.baseY + 3) sm.position.y = sm.userData.baseY;
  });

  // HP bergetar
  if(bubbleShake > 0){
    M.position.x = Math.sin(s*80) * .006 * bubbleShake;
    bubbleShake *= .92;
    if(bubbleShake < .01) bubbleShake = 0;
  } else {
    M.position.x += (0 - M.position.x) * .1;
  }

  R.render(S, C);
  requestAnimationFrame(loop);
}

  [39500, () => { say('kamu nggak sendirian.', 3200, 'sendirian'); }],
  [43000, () => {
    if(melodiInterval) clearInterval(melodiInterval);
    $('#st h1').textContent = 'TAMAT';
    $('#st p').textContent = 'untuk yang masih di pinggir rel';
    $('#st small').textContent = '';
    $('#go').textContent = '↻ Ulangi';
    $('#st').style.display = 'flex';
    $('#go').onclick = () => location.reload();
  }]
];

function runTimeline(){
  if(!started) return;
  const t = performance.now() - t0;
  while(tlIndex < TL.length && t >= TL[tlIndex][0]){
    try { TL[tlIndex][1](); } catch(e){ console.warn('TL error at step', tlIndex, e); }
    tlIndex++;
  }
}

// ============================================================
// 19. START
// ============================================================
$('#go').onclick = () => {
  $('#st').style.display = 'none';
  initAudio();
  t0 = performance.now();
  started = true;
};

// init kamera & jalankan
cp.copy(SHOTS.A[0]);
cl.copy(SHOTS.A[1]);
requestAnimationFrame(loop);
setInterval(runTimeline, 50);
</script>
