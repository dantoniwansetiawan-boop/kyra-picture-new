
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KYRA PICTURE Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{--bg:#f6f5f3;--c:#fff;--b:#e7e4df;--t:#18181b;--m:#6b6b73;--a:#8b6b4a;--ok:#2f7d57;--r:#c0453b}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--t);font:14px/1.45 Inter,system-ui,sans-serif}
a{cursor:pointer}
small,.m{color:var(--m)}
h1{font-size:22px;margin:0;font-weight:700}
h2{font-size:18px;margin:0}
h3{font-size:14px;margin:0;font-weight:600}
#shell{display:flex;min-height:100vh}
aside{width:224px;background:var(--c);border-right:1px solid var(--b);padding:22px 14px;position:sticky;top:0;height:100vh;flex-shrink:0}
.logo{font-weight:700;letter-spacing:.18em;font-size:15px;padding:0 10px 22px}
.logo i{display:block;font-style:normal;color:var(--a);font-size:10px;letter-spacing:.3em;font-weight:500}
#nav a{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;color:var(--m);font-weight:500;margin-bottom:2px}
#nav a b{width:18px;text-align:center;font-weight:400}
#nav a:hover{background:var(--bg)}
#nav a.on{background:var(--t);color:#fff}
#nav a.on b{color:#d9bf9c}
main{flex:1;min-width:0;padding:28px;max-width:1100px}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.act{display:flex;gap:8px;flex-wrap:wrap}
input,select,textarea{width:100%;background:#fff;border:1px solid var(--b);color:var(--t);padding:9px 11px;border-radius:9px;font:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid #d9c8b2;border-color:var(--a)}
button{background:var(--t);color:#fff;border:1px solid var(--t);padding:9px 15px;border-radius:9px;font:inherit;font-weight:600;cursor:pointer}
button:hover{opacity:.88}
button.ghost{background:#fff;color:var(--t);border-color:var(--b)}
button.red{background:#fff;color:var(--r);border-color:#ecc5c1}
.card{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 1px 2px #0000000a}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.cards .card{margin:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:16px}
.stat{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:16px}
.stat small{display:block}
.stat b{display:block;font-size:22px;margin-top:6px;font-weight:700}
.stat.k{background:var(--t);color:#fff;border-color:var(--t)}
.stat.k small{color:#bbb}
.stat.k b{color:#e6cfae}
.li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--b);cursor:pointer;align-items:center}
.li:last-child{border:0}
.nc{cursor:default}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--m);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--b);white-space:nowrap}
td{padding:12px;border-bottom:1px solid #f0eeea}
tr.c{cursor:pointer}
tr.c:hover td{background:#faf9f7}
.r{text-align:right;white-space:nowrap}
tbody tr:last-child td{border:0}
.pad{padding:14px}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;background:#f3ebe0;color:#8b6b4a;white-space:nowrap}
.pill.closed,.pill.ok{background:#e3f2ea;color:var(--ok)}
.pill.batal{background:#f8e4e2;color:var(--r)}
.pill.no{background:#f1f0ee;color:var(--m)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin:12px 0}
.row>input,.row>select{width:auto;flex:1;min-width:130px}
.modal{position:fixed;inset:0;background:#18181b88;display:grid;place-items:center;padding:14px;z-index:9;overflow:auto}
.box{background:var(--c);border-radius:16px;padding:22px;width:100%;max-width:460px;display:grid;gap:10px;max-height:94vh;overflow:auto;box-shadow:0 20px 50px #0003}
.box label{display:grid;gap:4px;color:var(--m);font-size:12px;font-weight:500}
.modalhead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.modalhead button{flex-shrink:0}
.fg{max-width:640px;grid-template-columns:1fr 1fr}
.fg h2,.w{grid-column:1/-1}
.box .row{margin:0}
.ar{grid-column:1/-1;display:grid;grid-template-columns:1.2fr 1.2fr .8fr auto;gap:6px;align-items:center;margin-top:6px}
.ar a{color:var(--r);padding:8px 6px;text-align:center;font-weight:700}
.ar a:hover{background:#f8e4e2;border-radius:6px}
.pv{max-width:820px;height:94vh;grid-template-rows:auto 1fr}
.pg{overflow:auto;background:#e9e7e4;border-radius:10px;padding:10px}
.pg canvas{display:block;margin:0 auto 10px;box-shadow:0 2px 10px #0002;background:#fff}
@media(max-width:760px){
 #shell{display:block}
 aside{position:fixed;bottom:0;left:0;right:0;top:auto;width:auto;height:auto;padding:6px;z-index:5;border-right:0;border-top:1px solid var(--b)}
 .logo{display:none}
 #nav{display:flex;overflow-x:auto;gap:2px}
 #nav a{flex-direction:column;gap:0;padding:6px 10px;font-size:10.5px;margin:0;white-space:nowrap}
 main{padding:16px 14px 84px}
 .hm{display:none}
 .fg{grid-template-columns:1fr}
 .ar{grid-template-columns:1fr 1fr}
 .modalhead{align-items:flex-start}
}
</style>
</head>
<body>
<div id="shell">
 <aside>
  <div class="logo">KYRA PICTURE<i>ADMIN</i></div>
  <div id="nav"></div>
 </aside>
 <main id="main"></main>
</div>

<script>
const SB_URL='https://uhwbafngzkicergeqqzm.supabase.co',SB_KEY='sb_publishable_DC_aE9FvhZO71tv7kFIwGw_Iuzx_Wn_';
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s),rp=n=>'Rp '+Math.round(+n||0).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.'),num=s=>+String(s??'').replace(/\D/g,'')||0;
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10),mk=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=d=>d?new Date(d+'T00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'-';
const T=['packages','addon_catalog','crew','clients','orders','order_items','payments','expenses','order_crew','settings'];
let D={},view='dash',oid=null,cid=null,qo='',qc='',per=today().slice(0,7),ef={a:'',b:'',i:'',c:''},ctab='ev',EDIT=null,PQ=0;

document.addEventListener('click',e=>{
 if(e.target.matches('input[type=date],input[type=time]'))try{e.target.showPicker()}catch(_){}
});

async function load(){
 for(const t of T){
  const r=await sb.from(t).select('*').order('id');
  if(r.error){
   alert('Gagal memuat '+t+': '+r.error.message+(t=='order_crew'?'\n(Jalankan update.sql di Supabase)':''));
   D[t]=[];
   continue;
  }
  D[t]=r.data;
 }
}
const by=(t,o)=>D[t].filter(x=>x.order_id==o),sum=a=>a.reduce((s,x)=>s+(+x.amount||0),0);
function calc(o){
 const items=sum(by('order_items',o.id)),tot=+o.package_price+items-(+o.discount||0),paid=sum(by('payments',o.id)),cost=sum(by('expenses',o.id)),closed=tot>0&&paid>=tot,st=o.cancelled?'BATAL':closed?'CLOSED':'OPEN';
 return{items,tot,paid,cost,st,rest:st=='OPEN'?tot-paid:0,profit:(o.cancelled?paid:tot)-cost};
}
const invNo=o=>`KP-${(o.inv_date||'').slice(0,4)}-${String(o.inv_no).padStart(4,'0')}`,cl=id=>D.clients.find(c=>c.id==id)||{},ordOf=id=>D.orders.find(o=>o.id==id),crw=id=>D.crew.find(c=>c.id==id)||{};
const op=(a,f)=>'<option value="">—</option>'+a.map(f).join(''),pill=s=>`<span class="pill ${s.toLowerCase()}">${s}</span>`,head=(t,a)=>`<div class="ph"><h1>${t}</h1><div class="act">${a||''}</div></div>`;
const METODE=['Transfer','Cash','PayPal'],CAT=['Crew','Transport','Cetak','Sewa Alat','Sewa Studio','Langganan','Iklan','Lainnya'];
const ORD=a=>op(a,o=>`<option value="${o.id}">${invNo(o)} · ${esc(cl(o.client_id).name)}</option>`);

function form(title,fields,vals,save){
 const m=document.createElement('div');
 m.className='modal';

 const inp=f=>f.t=='select'
  ?`<select name="${f.k}" ${f.r?'required':''}>${f.o}</select>`
  :f.t=='area'
  ?`<textarea name="${f.k}" rows="2"></textarea>`
  :f.t=='number'
  ?`<input name="${f.k}" class="rp" inputmode="numeric" autocomplete="off">`
  :`<input name="${f.k}" type="${f.t||'text'}" ${f.r?'required':''} ${f.dl?'list="cn" autocomplete="off"':''}>`;

 m.innerHTML=`
  <form class="box fg">
   <div class="modalhead w">
    <h2>${title}</h2>
    <button type="button" class="ghost" id="closeForm" aria-label="Close form">Close ×</button>
   </div>
   ${fields.map(f=>
    f.t=='addons'
    ?'<div class="w"><div class="row"><b>Add-on (opsional)</b><button type="button" class="ghost" id="adb">＋ Add-on</button></div><div id="adl"></div></div>'
    :f.t=='info'
    ?'<small class="w" id="pv"></small>'
    :`<label class="${f.w?'w':''}">${f.l}${inp(f)}</label>`
   ).join('')}
   <div class="row w">
    <button type="button" class="ghost" id="cancelForm">Batal</button>
    <button type="submit">Simpan</button>
   </div>
   <datalist id="cn">${D.clients.map(c=>`<option value="${esc(c.name)}">`).join('')}</datalist>
  </form>`;

 document.body.append(m);
 const fm=m.querySelector('form');
 const close=()=>m.remove();

 // Tombol Close dan Batal tidak lagi mengambil tombol .ghost pertama,
 // sehingga tombol Add-on tidak akan menutup form.
 fm.querySelector('#closeForm').onclick=close;
 fm.querySelector('#cancelForm').onclick=close;

 // Klik area gelap di luar form untuk menutup modal.
 m.addEventListener('click',e=>{if(e.target===m)close()});

 fm.querySelectorAll('.rp').forEach(e=>e.oninput=()=>{
  const d=e.value.replace(/\D/g,'');
  e.value=d?rp(d):'';
 });

 fields.forEach(f=>{
  const e=fm.elements.namedItem(f.k);
  if(e&&vals&&vals[f.k]!=null)e.value=f.t=='number'?rp(vals[f.k]):vals[f.k];
  if(f.h)f.h(fm);
 });

 fm.onsubmit=async e=>{
  e.preventDefault();
  const v={};
  fields.forEach(f=>{
   if(f.t=='info'||f.t=='addons')return;
   const el=fm.elements.namedItem(f.k);
   if(!el)return;
   let x=el.value;
   if(f.t=='number')x=num(x);
   else if(typeof x=='string'){x=x.trim();if(x==='')x=null}
   v[f.k]=x;
  });
  if(await save(v,fm)!==false)m.remove();
 };
}

async function db(p){
 const r=await p;
 if(r.error){alert(r.error.message);return false}
 await load();render();return true;
}
const ins=(t,v)=>db(sb.from(t).insert(v)),up=(t,id,v)=>db(sb.from(t).update(v).eq('id',id));
const fill=(fm,k,v)=>{
 const el=fm.elements.namedItem(k);
 if(!el)return;
 el.value=v;
 el.dispatchEvent(new Event('input',{bubbles:true}));
};
const hist=c=>D.order_crew.filter(x=>x.crew_id==c.id).map(x=>({x,o:ordOf(x.order_id)})).filter(h=>h.o).sort((a,b)=>(b.o.event_date||'').localeCompare(a.o.event_date||''));

const CF={
 clients:{t:'Client',f:()=>[
  {k:'name',l:'Nama',r:1},{k:'phone',l:'Kontak (WA)'},{k:'ig',l:'Instagram'},{k:'notes',l:'Catatan',t:'area',w:1}
 ]},
 packages:{t:'Paket',f:()=>[
  {k:'category',l:'Kategori',r:1},{k:'name',l:'Nama paket',r:1},{k:'price',l:'Harga',t:'number'}
 ]},
 addon_catalog:{t:'Additional',f:()=>[
  {k:'name',l:'Nama',r:1,w:1},{k:'amount',l:'Harga',t:'number'}
 ]},
 crew:{
  t:'Crew',
  f:()=>[{k:'name',l:'Nama',r:1},{k:'phone',l:'Kontak'},{k:'notes',l:'Catatan',t:'area',w:1}],
  x:c=>'<h3 style="margin-top:8px">Acara yang diikuti</h3>'+
   (hist(c).map(h=>`<div class="li nc"><span><b>${invNo(h.o)}</b> · ${esc(cl(h.o.client_id).name)}<br><small>${fmt(h.o.event_date)}</small></span><span class="pill no">${esc(h.x.role||'-')}</span></div>`).join('')||'<p class="m">Belum ada acara</p>')
 },
 order_crew:{
  o:1,t:'Crew Turun',
  f:()=>[{k:'crew_id',l:'Crew',t:'select',r:1,o:op(D.crew,c=>`<option value="${c.id}">${esc(c.name)}</option>`)},{k:'role',l:'Peran (bebas: FG, VG, FG/VG, Drone...)'}],
  s:x=>`<b>${esc(crw(x.crew_id).name)}</b> <span class="pill no">${esc(x.role||'-')}</span>`
 },
 order_items:{
  o:1,t:'Add-on',
  f:()=>[
   {k:'_p',l:'Pilih dari katalog (opsional)',t:'select',w:1,o:op(D.addon_catalog,a=>`<option value="${a.id}">${esc(a.name)}</option>`),h:fm=>{
    const select=fm.elements.namedItem('_p');
    select.onchange=()=>{
     const a=D.addon_catalog.find(x=>x.id==select.value);
     if(a){fm.elements.namedItem('name').value=a.name;fill(fm,'amount',a.amount)}
    };
   }},
   {k:'name',l:'Nama item',r:1},
   {k:'amount',l:'Harga',t:'number'}
  ],
  s:x=>`${esc(x.name)} <b>${rp(x.amount)}</b>`
 },
 payments:{
  o:1,t:'Pembayaran',d:()=>({method:'Transfer',paid_at:today()}),
  f:q=>[
   ...(q?[{k:'order_id',l:'Invoice',t:'select',r:1,w:1,o:ORD(D.orders.filter(o=>calc(o).st=='OPEN'))}]:[]),
   {k:'label',l:'Keterangan (DP / Pelunasan)',r:1},
   {k:'method',l:'Metode',t:'select',o:METODE.map(m=>`<option>${m}</option>`).join('')},
   {k:'amount',l:'Jumlah',t:'number',h:fm=>{
    const u=()=>{
     const orderEl=fm.elements.namedItem('order_id');
     const o=ordOf(orderEl?orderEl.value:oid);
     if(!o)return;
     const c=calc(o),old=EDIT?+D.payments.find(p=>p.id==EDIT).amount:0;
     fm.querySelector('#pv').textContent='Sisa setelah pembayaran ini: '+rp(Math.max(c.tot-(c.paid-old+num(fm.elements.namedItem('amount').value)),0));
    };
    fm.elements.namedItem('amount').addEventListener('input',u);
    const orderEl=fm.elements.namedItem('order_id');
    if(orderEl)orderEl.addEventListener('change',u);
    u();
   }},
   {k:'paid_at',l:'Tanggal',t:'date'},
   {k:'_i',t:'info'}
  ],
  s:x=>`${fmt(x.paid_at)} · ${esc(x.label)} <small>${esc(x.method||'')}</small> <b>${rp(x.amount)}</b>`
 },
 expenses:{
  t:'Pengeluaran',d:()=>({exp_date:today(),paid:false,category:'Lainnya'}),
  f:()=>[
   {k:'order_id',l:'No. Invoice (kosong = Operasional)',t:'select',w:1,o:ORD(D.orders.filter(o=>!o.cancelled))},
   {k:'category',l:'Kategori',t:'select',o:CAT.map(c=>`<option>${c}</option>`).join('')},
   {k:'name',l:'Keterangan',r:1},{k:'amount',l:'Jumlah',t:'number'},{k:'exp_date',l:'Tanggal',t:'date'},
   {k:'paid',l:'Status bayar',t:'select',o:'<option value="false">Belum dibayar</option><option value="true">Sudah dibayar</option>'}
  ],
  s:x=>`${fmt(x.exp_date)} · ${esc(x.name)} <small>${x.order_id?invNo(ordOf(x.order_id)):'Operasional'} · ${esc(x.category)}</small> <b>${rp(x.amount)}</b> <span class="pill ${x.paid?'ok':''}" onclick="event.stopPropagation();tg(${x.id})">${x.paid?'Dibayar':'Belum dibayar'}</span>`
 }
};

const tg=id=>up('expenses',id,{paid:!D.expenses.find(x=>x.id==id).paid});

function E(t,id,pre){
 if(t=='order_crew'&&!D.crew.length)return alert('Tambah crew dulu di menu Crew.');
 EDIT=id;
 const q=PQ;PQ=0;
 const c=CF[t];
 form((id?'Ubah ':'Tambah ')+c.t,c.f(q),id?D[t].find(r=>r.id==id):{...(c.d?c.d():{}),...pre},async v=>{
  Object.keys(v).forEach(k=>k[0]=='_'&&delete v[k]);
  if('paid'in v)v.paid=v.paid=='true';
  if(t=='payments'){
   if(!id&&!v.order_id)v.order_id=oid;
   const o=ordOf(id?D.payments.find(p=>p.id==id).order_id:v.order_id);
   const old=id?+D.payments.find(p=>p.id==id).amount:0;
   const rest=calc(o).tot-calc(o).paid+old;
   if(v.amount>rest&&!confirm('Nominal melebihi sisa tagihan ('+rp(Math.max(rest,0))+'). Tetap simpan?'))return false;
  }
  if(c.o&&!id&&!v.order_id)v.order_id=oid;
  return id?up(t,id,v):ins(t,v);
 });
}
const payQuick=()=>{PQ=1;E('payments')};

const X=(t,id)=>{
 if(t=='clients'&&D.orders.some(o=>o.client_id==id))return alert('Client ini masih punya order. Hapus ordernya dulu.');
 confirm('Hapus data ini?')&&db(sb.from(t).delete().eq('id',id)).then(ok=>ok&&['clients','crew'].includes(t)&&go(t));
};

function show(t,id){
 const c=CF[t],x=D[t].find(r=>r.id==id),m=document.createElement('div');
 m.className='modal';
 const val=f=>{
  const v=x[f.k];
  if(f.k=='order_id')return v?invNo(ordOf(v)):'Operasional';
  if(f.k=='crew_id')return esc(crw(v).name);
  if(v==null||v==='')return'-';
  if(f.t=='number')return rp(v);
  if(f.t=='date')return fmt(v);
  if(f.k=='paid')return v?'Sudah dibayar':'Belum dibayar';
  return esc(v);
 };
 m.innerHTML=`<div class="box"><h2>${c.t}</h2>${c.f(1).filter(f=>!['info','addons'].includes(f.t)).map(f=>`<div class="li nc"><span class="m">${f.l.replace(/\s*\(.*\)/,'')}</span><b>${val(f)}</b></div>`).join('')}${c.x?c.x(x):''}<div class="row"><button class="ghost">Tutup</button><span><button class="ghost">Ubah</button> <button class="red">Hapus</button></span></div></div>`;
 document.body.append(m);
 const b=m.querySelectorAll('button');
 b[0].onclick=()=>m.remove();
 b[1].onclick=()=>{m.remove();E(t,id)};
 b[2].onclick=()=>{m.remove();X(t,id)};
}
const lst=(t,a)=>a.map(x=>`<div class="li" onclick="show('${t}',${x.id})"><span>${CF[t].s(x)}</span></div>`).join('')||'<p class="m">Belum ada data</p>';
const sec=(t,title,a,pre)=>`<div class="card"><div class="row" style="margin-top:0"><h3>${title}</h3><button class="ghost" onclick="E('${t}',null,${pre||'{}'})">＋ Tambah</button></div>${lst(t,a)}</div>`;
const RK={OPEN:0,CLOSED:1,BATAL:2};

const oTable=(os=D.orders,q=qo)=>{
 q=q.toLowerCase();
 const r=os.map(o=>({o,...calc(o)})).filter(x=>!q||(cl(x.o.client_id).name+invNo(x.o)+x.o.package_name).toLowerCase().includes(q)).sort((a,b)=>RK[a.st]-RK[b.st]||b.o.inv_no-a.o.inv_no);
 return r.length?`<div class="tw"><table><thead><tr><th>Invoice</th><th>Client</th><th class="hm">Paket</th><th class="hm">Acara</th><th class="r">Total</th><th>Status</th></tr></thead><tbody>${r.map(x=>`<tr class="c" onclick="oid=${x.o.id};go('order')"><td><b>${invNo(x.o)}</b></td><td>${esc(cl(x.o.client_id).name)}</td><td class="hm">${esc(x.o.package_name)}</td><td class="hm">${fmt(x.o.event_date)}</td><td class="r">${rp(x.tot)}</td><td>${pill(x.st)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="m pad">Tidak ada order</p>';
};
const cTable=()=>{
 const q=qc.toLowerCase(),r=D.clients.filter(c=>!q||(c.name+(c.phone||'')+(c.ig||'')).toLowerCase().includes(q)).reverse();

async function clientId(name,phone,cur){
 let c=D.clients.find(x=>x.name.toLowerCase()==name.toLowerCase());
 if(!c&&cur&&D.orders.filter(o=>o.client_id==cur).length<=1){
  c=D.clients.find(x=>x.id==cur);
  if(c)await sb.from('clients').update({name}).eq('id',c.id);
 }
 if(!c){
  const r=await sb.from('clients').insert({name,phone}).select().single();
  if(r.error){alert(r.error.message);return null}
  return r.data.id;
 }
 if(phone&&phone!=c.phone)await sb.from('clients').update({phone}).eq('id',c.id);
 return c.id;
}

function orderForm(id){

  {k:'package_name',l:'Nama paket (di invoice)',r:1},
  {k:'package_price',l:'Harga paket',t:'number'},
  {k:'discount',l:'Diskon (opsional)',t:'number'},

  ...(!id?[
   {k:'_ad',t:'addons',h:fm=>{
    const L=fm.querySelector('#adl');

     // Jika katalog kosong, pengguna masih dapat mengisi nama dan harga manual.
     r.innerHTML=`
      <select aria-label="Choose add-on">
       ${op(D.addon_catalog,a=>`<option value="${a.id}">${esc(a.name)} — ${rp(a.amount)}</option>`)}
      </select>
      <input data-name placeholder="Nama add-on" aria-label="Add-on name">
      <input data-amount class="rp" inputmode="numeric" autocomplete="off" placeholder="Rp 0" aria-label="Add-on price">
      <a role="button" tabindex="0" aria-label="Remove add-on" title="Remove add-on">✕</a>
     `;

     const sel=r.querySelector('select');
     const name=r.querySelector('[data-name]');
     const amount=r.querySelector('[data-amount]');
     const remove=r.querySelector('a');

     const sync=()=>{
      const a=D.addon_catalog.find(y=>String(y.id)===String(sel.value));
      if(!a)return;
      name.value=a.name;
      amount.value=rp(a.amount);
      upd();
     };

     sel.onchange=sync;
     amount.oninput=()=>{
      const digits=amount.value.replace(/\D/g,'');
      amount.value=digits?rp(digits):'';
      upd();
     };
     name.addEventListener('input',upd);

     const removeRow=()=>{r.remove();upd()};
     remove.onclick=removeRow;
     remove.onkeydown=e=>{
      if(e.key==='Enter'||e.key===' '){e.preventDefault();removeRow()}
     };

     L.appendChild(r);
     if(D.addon_catalog.length&&sel.value)sync();
     upd();

  {k:'event_date',l:'Tanggal acara',t:'date'},
  {k:'event_time',l:'Jam acara',t:'time'},

 ],{...o,cname:k.name,cphone:k.phone},async(v,fm)=>{

  if(!cidn)return false;
  v.client_id=cidn;

  const items=id?[]:[...fm.querySelectorAll('.ar')].map(r=>({
   name:r.querySelector('[data-name]').value.trim(),
   amount:num(r.querySelector('[data-amount]').value)
  })).filter(x=>x.name);

  if(items.some(x=>x.amount<0))return false;

  const r=id
   ?await sb.from('orders').update(v).eq('id',id)
   :await sb.from('orders').insert(v).select().single();

  if(r.error){alert(r.error.message);return false}

    if(pr.error)alert('Order tersimpan, tetapi DP gagal disimpan: '+pr.error.message);
   }
  }

  await load();
  render();
 });
}

function csv(){
 T.forEach((t,i)=>setTimeout(()=>{
  const r=D[t];
  if(!r||!r.length)return;
  const h=Object.keys(r[0]),s=[h,...r.map(x=>h.map(k=>x[k]))].map(a=>a.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n'),a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\ufeff'+s],{type:'text/csv'}));
  a.download=`kyra_${t}.csv`;
  a.click();
 },i*500));
}

function ic(d,t,x,y){
 d.setLineWidth(.3);d.setDrawColor(90);
 if(t=='w'){d.circle(x,y,2);d.ellipse(x,y,.9,2);d.line(x-2,y,x+2,y)}
 else if(t=='i'){d.roundedRect(x-2,y-2,4,4,1.2,1.2);d.circle(x,y,.9);d.circle(x+1.2,y-1.2,.2,'F')}
 else{d.setFillColor(37,160,90);d.circle(x,y,2,'F');d.setDrawColor(255);d.circle(x,y,1.1);d.setFillColor(255);d.triangle(x-2,y+2,x-1.6,y+.6,x-.6,y+1.4,'F')}
}

 d.rect(15,y-6,180,9,'F');
 d.setTextColor(255);

 d.text('Description',18,y);

 });

 d.setFont('helvetica','bold');

 [['Total',c.tot],['Paid',c.paid],['Balance Due',Math.max(c.tot-c.paid,0)]].forEach(([n,a])=>{

 });

 const P=by('payments',o.id).sort((a,b)=>(a.paid_at||'').localeCompare(b.paid_at||'')||a.id-b.id);

  P.forEach(p=>{
   need(7);
   d.text(fmt(p.paid_at),18,y);
   d.text(String(p.label||''),55,y);
   d.text(String(p.method||''),115,y);
   d.text(rp(p.amount),192,y,{align:'right'});

 }

 y+=6;
 need(50);
 d.setFontSize(10);

 d.text('Terms & Conditions',15,y);
 d.setFont('helvetica','normal');
 const ts=d.splitTextToSize(o.terms||'',180);
 d.text(ts,15,y+6);
 y+=ts.length*5+14;

 need(28);
 d.setFont('helvetica','bold');
 d.text('Payment Information',15,y);
 d.setFont('helvetica','normal');
 d.text(['BCA (Bank Central Asia) - Indonesia','Account No.: 736-033-6519','PayPal: paypal.me/deniwan'],15,y+6);

 // Footer terpusat secara konsisten pada halaman invoice.

 for(let page=1;page<=totalPages;page++){

 }

 return d;

async function prev(id){
 const o=ordOf(id),d=mkpdf(o),m=document.createElement('div');
 m.className='modal';
 m.innerHTML=`<div class="box pv"><div class="row"><b>${invNo(o)}</b><span><button class="ghost">Download PDF</button> <button>Close</button></span></div><div class="pg" id="pg">Loading invoice…</div></div>`;
 document.body.append(m);
 const b=m.querySelectorAll('button'),pg=m.querySelector('#pg');
 b[0].onclick=()=>d.save(invNo(o)+'.pdf');
 b[1].onclick=()=>m.remove();

 try{
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const pdf=await pdfjsLib.getDocument({data:d.output('arraybuffer')}).promise,w=pg.clientWidth-20;
  pg.innerHTML='';
  for(let i=1;i<=pdf.numPages;i++){
   const p=await pdf.getPage(i),s=w/p.getViewport({scale:1}).width,v=p.getViewport({scale:s*(devicePixelRatio||1)}),cv=document.createElement('canvas');
   cv.width=v.width;cv.height=v.height;cv.style.width=w+'px';
   pg.append(cv);
   await p.render({canvasContext:cv.getContext('2d'),viewport:v}).promise;
  }
 }catch(e){
  pg.innerHTML=`<iframe src="${d.output('bloburl')}" style="width:100%;height:100%;min-height:70vh;border:0;background:#fff"></iframe>`;
 }
}
load().then(render);
</script>
