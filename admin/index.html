client(){const c=D.clients.find(x=>x.id==cid);if(!c){view='clients';return V.clients()}const os=D.orders.filter(o=>o.client_id==c.id);
 return `<div class="row"><a onclick="go('clients')">← Kembali</a><span><button class="ghost" onclick="E('clients',${c.id})">Ubah</button> <button class="red" onclick="X('clients',${c.id})">Hapus</button></span></div>
 <div class="card"><h2>${esc(c.name)}</h2><p>${esc(c.phone||'-')} · ${esc(c.ig||'-')}<br><small>${esc(c.notes||'')}</small></p><div class="li" style="cursor:default"><span>Total sudah dibayar</span><b>${rp(os.reduce((s,o)=>s+calc(o).paid,0))}</b></div></div>
 <div class="card"><h3>Order</h3>${oList(os,'')}</div>`},
order(){const o=ordOf(oid);if(!o){view='orders';return V.orders()}const c=calc(o),k=cl(o.client_id);
 return `<div class="row"><a onclick="go('orders')">← Kembali</a><span><button onclick="prev(${o.id})">Invoice PDF</button> <button class="ghost" onclick="orderForm(${o.id})">Ubah</button> <button class="ghost" onclick="up('orders',${o.id},{cancelled:${!o.cancelled}})">${o.cancelled?'Aktifkan lagi':'Batalkan'}</button> <button class="red" onclick="delOrder()">Hapus</button></span></div>
 <div class="card"><h2>${invNo(o)} <i class="tag ${c.st=='CLOSED'?'ok':c.st=='BATAL'?'no':''}">${c.st}</i></h2><p><a onclick="cid=${k.id};go('client')">${esc(k.name)}</a> <small>${esc(k.phone||'')} ${esc(k.ig||'')}</small><br><small>${fmt(o.event_date)} ${(o.event_time||'').slice(0,5)} · ${esc(o.location||'')}</small></p>
 <div class="li" style="cursor:default"><span>${esc(o.package_name)}</span><b>${rp(o.package_price)}</b></div><div class="li" style="cursor:default"><span>Add-on</span><b>${rp(c.items)}</b></div><div class="li" style="cursor:default"><span>Diskon</span><b>- ${rp(o.discount)}</b></div><div class="li" style="cursor:default"><span>Total tagihan</span><b>${rp(c.tot)}</b></div><div class="li" style="cursor:default"><span>Terbayar</span><b>${rp(c.paid)}</b></div><div class="li" style="cursor:default"><span>Sisa</span><b style="color:var(--g)">${rp(Math.max(c.tot-c.paid,0))}</b></div></div>
 ${sec('order_items','Add-on / Tambahan',by('order_items',o.id))}${sec('payments','Riwayat Pembayaran',by('payments',o.id))}${sec('expenses','Pengeluaran',by('expenses',o.id),'{order_id:oid}')}
 <div class="card"><div class="li" style="cursor:default"><span>Total pengeluaran</span><b>${rp(c.cost)}</b></div><div class="li" style="cursor:default"><span>Profit order ini</span><b style="color:var(--ok)">${rp(c.profit)}</b></div></div>`},
exp(){const sl=(v,a)=>a.map(([k,l])=>`<option value="${k}" ${k==v?'selected':''}>${l}</option>`).join('');
 if(tab=='crew')return `<div class="row"><span><button class="ghost" onclick="tab='all';render()">Semua Pengeluaran</button> <button>Daftar Crew</button></span></div>`+sec('crew','Daftar Crew',D.crew);
 const a=D.expenses.filter(e=>(!ef.m||(e.exp_date||'').startsWith(ef.m))&&(!ef.c||e.category==ef.c)&&(!ef.i||(ef.i=='ops'?!e.order_id:e.order_id==ef.i))).reverse(),ms=[['','Semua bulan'],...[...Array(12)].map((_,i)=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);return[mk(d),mk(d)]})];
 return `<div class="row"><span><button>Semua Pengeluaran</button> <button class="ghost" onclick="tab='crew';render()">Daftar Crew</button></span><button onclick="E('expenses')">＋ Pengeluaran</button></div>
 <div class="row"><select onchange="ef.m=this.value;render()">${sl(ef.m,ms)}</select><select onchange="ef.i=this.value;render()">${sl(ef.i,[['','Semua invoice'],['ops','Operasional (tanpa invoice)'],...D.orders.map(o=>[o.id,invNo(o)+' · '+cl(o.client_id).name])])}</select><select onchange="ef.c=this.value;render()">${sl(ef.c,[['','Semua kategori'],...CAT.map(c=>[c,c])])}</select></div>
 <div class="grid"><div class="card"><small>Total (sesuai filter)</small><b class="big">${rp(sum(a))}</b></div><div class="card"><small>Fee crew belum dibayar</small><b class="big">${rp(sum(D.expenses.filter(e=>e.category=='Crew'&&!e.paid)))}</b></div></div><div class="card">${lst('expenses',a)}</div>`},
cat:()=>sec('packages','Paket',D.packages)+sec('addon_catalog','Katalog Additional',D.addon_catalog),
set(){const t=(D.settings.find(s=>s.key=='terms')||{}).value||'';return `<div class="card"><h3>Syarat & ketentuan default</h3><p class="m">Dipakai untuk order baru.</p><textarea id="tt" rows="3">${esc(t)}</textarea><div class="row"><button onclick="saveT()">Simpan</button></div></div><div class="card"><h3>Backup</h3><p class="m">Download semua data sebagai CSV.</p><button onclick="csv()">Export CSV</button></div>`}};
const saveT=()=>db(sb.from('settings').upsert({key:'terms',value:$('#tt').value},{onConflict:'key'}));
function csv(){T.forEach((t,i)=>setTimeout(()=>{const r=D[t];if(!r.length)return;const h=Object.keys(r[0]),s=[h,...r.map(x=>h.map(k=>x[k]))].map(a=>a.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+s],{type:'text/csv'}));a.download=`kyra_${t}.csv`;a.click()},i*500))}
function render(){if(!D.orders)return;const on={order:'orders',client:'clients'}[view]||view;$('#nav').innerHTML=[['dash','Dashboard'],['orders','Order'],['clients','Client'],['exp','Pengeluaran'],['cat','Katalog'],['set','Pengaturan']].map(([k,l])=>`<a class="${on==k?'on':''}" onclick="go('${k}')">${l}</a>`).join('');$('#main').innerHTML=V[view]()}
const go=v=>{view=v;render();scrollTo(0,0)};
function ic(d,t,x,y){d.setLineWidth(.3);d.setDrawColor(90);
 if(t=='w'){d.circle(x,y,2);d.ellipse(x,y,.9,2);d.line(x-2,y,x+2,y)}
 else if(t=='i'){d.roundedRect(x-2,y-2,4,4,1.2,1.2);d.circle(x,y,.9);d.circle(x+1.2,y-1.2,.2,'F')}
 else{d.setFillColor(37,160,90);d.circle(x,y,2,'F');d.setDrawColor(255);d.circle(x,y,1.1);d.setFillColor(255);d.triangle(x-2,y+2,x-1.6,y+.6,x-.6,y+1.4,'F')}}
function mkpdf(o){
 const c=calc(o),k=cl(o.client_id),d=new jspdf.jsPDF();let y;const need=h=>{if(y+h>255){d.addPage();y=20}};
 d.setFont('times','bold');d.setFontSize(28);d.setTextColor(150,115,50);d.text('KYRA PICTURE',15,22);
 d.setFont('helvetica','bold');d.setFontSize(18);d.setTextColor(40);d.text('INVOICE',195,20,{align:'right'});
 d.setFont('helvetica','normal');d.setFontSize(10);d.setTextColor(90);d.text(invNo(o),195,27,{align:'right'});d.text('Tanggal: '+fmt(o.inv_date),195,32,{align:'right'});
 d.setDrawColor(200,170,110);d.line(15,38,195,38);d.setTextColor(40);d.setFont('helvetica','bold');d.text('Ditagihkan kepada',15,48);d.setFont('helvetica','normal');
 d.text([k.name||'',k.phone||'',k.ig||''].filter(Boolean),15,54);d.setFont('helvetica','bold');d.text('Detail acara',110,48);d.setFont('helvetica','normal');
 d.text(d.splitTextToSize(`${fmt(o.event_date)} ${(o.event_time||'').slice(0,5)}\n${o.location||''}`,85),110,54);
 y=80;d.setFillColor(30,30,32);d.rect(15,y-6,180,9,'F');d.setTextColor(255);d.setFont('helvetica','bold');d.text('Deskripsi',18,y);d.text('Jumlah',192,y,{align:'right'});
 d.setTextColor(40);d.setFont('helvetica','normal');y+=10;
 const L=[[o.package_name,o.package_price],...by('order_items',o.id).map(i=>['+ '+i.name,i.amount])];if(+o.discount)L.push(['Diskon',-o.discount]);
 L.forEach(([n,a])=>{const s=d.splitTextToSize(String(n),120);need(s.length*5+3);d.text(s,18,y);d.text((a<0?'- ':'')+rp(Math.abs(a)),192,y,{align:'right'});y+=s.length*5+3});
 need(30);d.line(110,y,195,y);y+=7;const y0=y;d.setFont('helvetica','bold');
 [['Total',c.tot],['Terbayar',c.paid],['Sisa tagihan',Math.max(c.tot-c.paid,0)]].forEach(([n,a])=>{d.text(n,112,y);d.text(rp(a),192,y,{align:'right'});y+=7});
 if(c.st!='OPEN'){d.setTextColor(...(c.st=='BATAL'?[200,70,60]:[40,150,90]));d.setFontSize(38);d.text(c.st=='BATAL'?'BATAL':'PAID',25,y0+10,{angle:12});d.setFontSize(10);d.setTextColor(40)}
 const P=by('payments',o.id).sort((a,b)=>(a.paid_at||'').localeCompare(b.paid_at||'')||a.id-b.id);
 if(P.length){y+=6;need(20);d.setFontSize(10);d.text('Riwayat Pembayaran',15,y);y+=6;d.setFontSize(9);d.setTextColor(90);d.text('Tanggal',18,y);d.text('Keterangan',55,y);d.text('Metode',115,y);d.text('Nominal',192,y,{align:'right'});d.setFont('helvetica','normal');d.setTextColor(40);y+=2;d.line(15,y,195,y);y+=5;
  P.forEach(p=>{need(7);d.text(fmt(p.paid_at),18,y);d.text(String(p.label||''),55,y);d.text(String(p.method||''),115,y);d.text(rp(p.amount),192,y,{align:'right'});y+=6})}
 y+=6;need(50);d.setFontSize(10);d.setFont('helvetica','bold');d.text('Syarat & Ketentuan',15,y);d.setFont('helvetica','normal');const ts=d.splitTextToSize(o.terms||'',180);d.text(ts,15,y+6);y+=ts.length*5+14;
 d.setFont('helvetica','bold');d.text('Informasi Pembayaran',15,y);d.setFont('helvetica','normal');d.text(['BCA (Bank Central Asia) - Indonesia','No. Rek: 736-033-6519','PayPal: paypal.me/deniwan'],15,y+6);
 d.setPage(d.getNumberOfPages());d.setDrawColor(200,170,110);d.line(15,266,195,266);d.setFontSize(8.5);d.setTextColor(90);
 ic(d,'w',20,271.2);d.text('kyrapicture.com',24,272);ic(d,'i',76,271.2);d.text('@kyra.picture',80,272);ic(d,'a',125,271.2);d.text('+62 895-1984-7571',129,272);
 d.text('Perumahan Griya Mulya Indah, Jalan Sampora Blok M4 No. 28, Jayamulya, Serang Baru',105,278,{align:'center'});d.text('Serang Baru, Kab. Bekasi, Jawa Barat, ID 17330',105,283,{align:'center'});
 return d}
function prev(id){const o=ordOf(id),d=mkpdf(o),u=d.output('bloburl'),m=document.createElement('div');m.className='modal';
 m.innerHTML=`<div class="box" style="max-width:720px;height:92vh;grid-template-rows:auto 1fr auto"><h2>${invNo(o)}</h2><iframe src="${u}" style="width:100%;height:100%;border:0;background:#fff;border-radius:8px"></iframe><div class="row"><button class="ghost">Tutup</button><span><a href="${u}" target="_blank"><button type="button" class="ghost">Tab baru</button></a> <button>Unduh PDF</button></span></div></div>`;
 document.body.append(m);const b=m.querySelectorAll('button');b[0].onclick=()=>m.remove();b[2].onclick=()=>d.save(invNo(o)+'.pdf')}
load().then(render);
</script></body></html>
